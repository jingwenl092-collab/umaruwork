<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日译训练场 · 中日翻译与同传训练</title>
<meta name="description" content="每天十句，练出中日翻译与同声传译的底气：支持盲听限时同传与看句翻译，即时对比参考译文。" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="logo" id="logoBtn"><span class="logo-mark"></span>日译训练场</div>
    <nav class="topnav">
      <button class="navlink" id="navHome">首页</button>
      <button class="navlink" id="navHistory">练习日志</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- 首页 -->
  <section id="view-home" class="view">
    <div class="hero">
      <h1>每天十句，练出中日翻译与同传的底气</h1>
      <p>盲听限时开口 / 看句翻译 → 秒级对比标准译文与重合度，逼出肌肉记忆。</p>
    </div>
    <div class="card pick-card">
      <div class="pick-label">① 练习方向</div>
      <div class="dir-row" id="dirRow">
        <button class="dir-btn active" data-dir="zh2ja"><b>中 → 日</b><span>听/看中文，译成日语</span></button>
        <button class="dir-btn" data-dir="ja2zh"><b>日 → 中</b><span>听/看日语，译成中文</span></button>
      </div>

      <div class="pick-label">② 训练模式</div>
      <div class="dir-row" id="trainModeRow">
        <button class="dir-btn active" data-tmode="interp"><b>🎧 盲听限时（同传/交传）</b><span>隐藏原句自动播音，读完立刻限时开口</span></button>
        <button class="dir-btn" data-tmode="sight"><b>📖 常规看句（视译/笔译）</b><span>直接显示原句与注音，自由口译或打字</span></button>
      </div>

      <div class="pick-label">③ 难度</div>
      <div class="pill-row" id="levelRow">
        <button class="pill" data-level="1">初级</button>
        <button class="pill active" data-level="2">中级</button>
        <button class="pill" data-level="3">高级</button>
      </div>
      <div class="pick-label">④ 场景</div>
      <div class="pill-row" id="sceneRow">
        <button class="pill active" data-scene="daily">日常生活</button>
        <button class="pill" data-scene="travel">旅行</button>
        <button class="pill" data-scene="business">商务</button>
        <button class="pill" data-scene="campus">校园</button>
      </div>
      <div class="start-row">
        <button class="btn-primary big" id="startBtn">开始练习 · 10 句</button>
      </div>
      <p class="tip" id="voiceTip">提示：语音口译与自动朗读建议使用 Chrome 或 Edge 浏览器，并允许麦克风权限。</p>
    </div>
    <div class="stats-row" id="homeStats"></div>
  </section>

  <!-- 练习页 -->
  <section id="view-practice" class="view hidden">
    <div class="p-top">
      <div class="p-meta" id="practiceMeta"></div>
      <div class="p-count" id="practiceCount"></div>
      <button class="btn-ghost small" id="exitBtn">退出</button>
    </div>
    <div class="p-progress"><div class="p-progress-in" id="progressBar"></div></div>

    <div class="card src-card">
      <div class="src-head">
        <div class="src-label" id="srcLabel">原句</div>
        <div class="timer-badge hidden" id="timerBadge">⏱ 反应限时 <b id="timerSec">15</b>s</div>
      </div>
      <div class="src-text" id="srcText"></div>
      <div class="src-actions">
        <button class="btn-hear" id="speakBtn">▷ 朗读原句</button>
        <button class="btn-ghost small hidden" id="peekBtn">👁 显示原句</button>
      </div>
      <div class="hint-text hidden" id="srcSpeechHint"></div>
    </div>

    <div class="card input-card" id="inputCard">
      <div class="mic-area" id="micArea">
        <button class="mic-btn" id="micBtn" aria-label="开始口译">
          <svg viewBox="0 0 24 24" width="26" height="26"><rect x="9" y="3" width="6" height="11" rx="3" fill="#fff"/><path d="M6 11a6 6 0 0 0 12 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M12 17v4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="mic-hint" id="micHint">点击开始口译，说完自动结束</div>
        <button class="btn-ghost small" id="modeBtn">切换打字输入</button>
      </div>
      <div class="answer-area">
        <label class="ans-label" for="answerInput">你的翻译（识别结果可手动修正）</label>
        <textarea id="answerInput" rows="3" placeholder="对着麦克风说出来，或直接在这里打字"></textarea>
      </div>
      <button class="btn-primary big" id="submitBtn" disabled>提交对比参考译文</button>
    </div>

    <div class="card feedback-card hidden" id="feedbackCard">
      <div class="fb-head">
        <span class="fb-badge" id="fbBadge">重合度 0%</span>
        <span class="fb-verdict" id="fbVerdict"></span>
      </div>
      <div id="fbBody"></div>
      <div class="ref-box">
        <div class="ref-label">标准参考译文（绿底为命中字词）</div>
        <div class="ref-text" id="refText"></div>
        <div class="ref-diff" id="refDiff"></div>
        <button class="btn-hear" id="refSpeakBtn">▷ 朗读参考译文</button>
        <div class="hint-text hidden" id="speechHint"></div>
      </div>

      <div class="ai-box" id="aiBox">
        <div class="ai-head">🤖 AI 讲评</div>

        <div class="ai-state" id="aiLoading">
          <span class="spinner"></span> 教练正在看你的翻译…
        </div>

        <div class="ai-state hidden" id="aiError">
          <span class="ai-err-text" id="aiErrText"></span>
          <button class="btn-ghost small" id="aiRetryBtn">重试</button>
        </div>

        <div class="hidden" id="aiContent"></div>
      </div>

      <button class="btn-primary big" id="nextBtn">下一句</button>
    </div>
  </section>

  <!-- 报告页 -->
  <section id="view-report" class="view hidden">
    <div class="hero small">
      <h1>本轮练习回顾</h1>
      <p id="reportMeta"></p>
    </div>
    <div id="reportList"></div>
    <div class="action-row">
      <button class="btn-primary big" id="againBtn">再来一轮</button>
      <button class="btn-ghost" id="backHomeBtn">返回首页</button>
    </div>
  </section>

  <!-- 历史页 -->
  <section id="view-history" class="view hidden">
    <div class="hero small">
      <h1>练习日志</h1>
      <p>记录保存在本浏览器里，换设备不会同步。</p>
    </div>
    <div class="stats-row" id="historyStats"></div>
    <div id="historyList"></div>
    <div class="action-row">
      <button class="btn-danger" id="clearBtn">清空全部记录</button>
      <button class="btn-ghost" id="backHomeBtn2">返回首页</button>
    </div>
  </section>

</main>

<footer class="foot">日译训练场 · 坚持每天十句，翻译自然开口成章</footer>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="js/cloud-config.js"></script>
<script src="js/data-daily.js"></script>
<script src="js/data-travel.js"></script>
<script src="js/data-business.js"></script>
<script src="js/data-campus.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
